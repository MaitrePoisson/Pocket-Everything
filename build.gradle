plugins {
    id 'java-library'
    id 'org.quiltmc.loom' version '1.11.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "pocket-everything-${mod_loader}-${minecraft_version}"
}

tasks.withType(Jar).configureEach {
    archiveVersion = ''
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    dev {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        pocket_everything {
            sourceSet sourceSets.main
        }
        pocket_everything_dev {
            sourceSet sourceSets.dev
        }
    }
    runs {
        screenshot {
            client()
            source sourceSets.dev
            runDir 'runs/screenshot'
            vmArg "-Dpocket_everything.screenshot.dir=${layout.buildDirectory.dir('screenshots').get().asFile.absolutePath}"
            programArgs '--width', '960', '--height', '540'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "org.quiltmc:quilt-loader:${quilt_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'project.dir', projectDir.absolutePath
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

processResources {
    var replaceProperties = [
        minecraft_version    : minecraft_version,
        quilt_loader_version : quilt_loader_version,
        mod_id               : mod_id,
        mod_group_id         : mod_group_id,
        mod_name             : mod_name,
        mod_version          : mod_version,
        mod_license          : mod_license,
        mod_authors          : mod_authors,
        mod_description      : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['quilt.mod.json']) {
        expand replaceProperties
    }
}

tasks.named('remapJar') {
    archiveVersion = ''
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'pocket_everything_gametest'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
        clearRunDirectory = true
    }
}
