plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'pocket-everything'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    gametest
    dev
}

repositories {
    mavenLocal()
}

neoForge {
    version = neo_version

    parchment {
        enabled = false
    }

    mods {
        pocket_everything {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
            sourceSet sourceSets.dev
        }
    }

    unitTest {
        enable()
        testedMod = mods.pocket_everything
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        screenshot {
            client()
            gameDirectory = file("runs/screenshot")
            systemProperty "pocket_everything.screenshot.dir", layout.buildDirectory.dir("screenshots").get().asFile.absolutePath
            programArguments = ["--width", "960", "--height", "540"]
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)
neoForge.addModdingDependenciesTo(sourceSets.dev)

dependencies {
    gametestImplementation sourceSets.main.output
    devImplementation sourceSets.main.output
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'project.dir', projectDir.absolutePath
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

processResources {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neo_min_version  : neo_min_version,
        neo_max_version  : neo_max_version,
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_version      : mod_version,
        mod_license      : mod_license,
        mod_authors      : mod_authors,
        mod_description  : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
